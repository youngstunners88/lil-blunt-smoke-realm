        <h1>Lil Blunt: The Smoke Realm</h1>
        <p>
          Lil Blunt: The Smoke Realm is a free 2D side-scrolling platformer
          you play in your web browser at smokegame.win. There is no download
          and no wallet. You control Lil Blunt, a green outlaw prospector,
          running and jumping through the Dustrock Mines of an 1800s Wild West
          mining town. Jump the mine carts, dodge the hazards, and get as deep
          as you can before you lose your lives. Scores are shown on a
          demonstration board styled as an old-west wanted poster; they are not
          recorded on a blockchain. The recurring antagonist is the Tax Man, who
          turns up to take a cut of what you dig.
        </p>
        <p>
          Controls are A and D to move, W or Space to jump, J to attack, and K
          to dash. The arrow keys are not bound.
        </p>
        <p>
          Lil Blunt: The Smoke Realm is a browser game, not the music artist of
          a similar name.
        </p>
        <p>
          The game is free. There is nothing to buy, no crypto wallet to
          install or fund, and no transaction fee. This website is served from
          the Internet Computer (ICP), a public blockchain that hosts complete
          web applications. Signing in is optional and uses Internet Identity,
          which authenticates with your device's fingerprint reader, face scan,
          or hardware key rather than a password or seed phrase.
        </p>
        <p>
          The leaderboard and ecosystem figures shown on this site are
          demonstration data, labelled DEMO where they appear; a live on-chain
          leaderboard with real player scores has not shipped yet. There is no
          token reward, airdrop, or NFT minting attached to playing — Proof of
          Play is an achievement layer, not a payout.
        </p>
